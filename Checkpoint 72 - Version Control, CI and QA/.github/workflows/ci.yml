name: Node CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Checkpoint - Git CI and QA/package-lock.json"

      - name: Install dependencies
        working-directory: Checkpoint - Git CI and QA
        run: npm ci

      - name: Run linter (ESLint)
        working-directory: Checkpoint - Git CI and QA
        run: npm run lint

      - name: Run unit tests
        working-directory: Checkpoint - Git CI and QA
        run: npm test

      - name: Run build check
        working-directory: Checkpoint - Git CI and QA
        run: npm run build
